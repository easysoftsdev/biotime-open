[mypy]
python_version = 3.12
warn_unused_configs = True
ignore_missing_imports = False
show_error_codes = True

# Third-party packages without type information.
[mypy-celery.*]
ignore_missing_imports = True

[mypy-jose.*]
ignore_missing_imports = True

[mypy-passlib.*]
ignore_missing_imports = True

[mypy-openpyxl.*]
ignore_missing_imports = True

[mypy-pyotp.*]
ignore_missing_imports = True

[mypy-sentry_sdk.*]
ignore_missing_imports = True

[mypy-prometheus_fastapi_instrumentator.*]
ignore_missing_imports = True

[mypy-minio.*]
ignore_missing_imports = True

[mypy-fastapi_mail.*]
ignore_missing_imports = True
